name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm run lint

  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm test

  build-and-deploy:
    name: Build, Push ECR & Deploy Frontend
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: docker build -t frontend:latest ./frontend

      - name: Configure AWS Credentials
        run: echo "Configuring AWS credentials..."

      - name: Log in to Amazon ECR
        run: echo "Logging into Amazon ECR..."

      - name: Push Docker Image to ECR
        run: echo "Pushing frontend image to ECR..."

      - name: Deploy to Kubernetes Cluster
        run: echo "Deploying frontend to EKS cluster..."