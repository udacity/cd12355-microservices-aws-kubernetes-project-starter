name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then npm install; else echo "Skipping"; fi
      - name: Run Lint
        run: |
          if [ -f "package.json" ]; then npm run lint --if-present; else echo "Skipping"; fi

  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then npm install; else echo "Skipping"; fi
      - name: Run Tests
        run: |
          if [ -f "package.json" ]; then npm test --if-present -- --watchAll=false; else echo "Skipping"; fi

  build-and-deploy:
    name: Build, Push ECR & Deploy Frontend
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: frontend
          IMAGE_TAG: ${{ github.sha }}
          REACT_APP_MOVIE_API_URL: ${{ secrets.REACT_APP_MOVIE_API_URL }}
        run: |
          if [ -f "Dockerfile" ]; then
            docker build --build-arg REACT_APP_MOVIE_API_URL=$REACT_APP_MOVIE_API_URL -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          else
            echo "No frontend Dockerfile, skipping push"
          fi

      - name: Deploy to Kubernetes Cluster
        run: |
          aws eks update-kubeconfig --name cluster --region us-east-1 || true
          kubectl set image deployment/frontend-deployment frontend=${{ steps.login-ecr.outputs.registry }}/frontend:${{ github.sha }} || true