name: Backend Continuous Integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('analytics/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: |
          if [ -f "analytics/package.json" ]; then cd analytics && npm install; else echo "No JS dependencies"; fi
      - name: Run Lint
        run: |
          if [ -f "analytics/package.json" ]; then cd analytics && npm run lint --if-present; else echo "Skipping lint"; fi

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('analytics/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: |
          if [ -f "analytics/package.json" ]; then cd analytics && npm install; else echo "No JS dependencies"; fi
      - name: Run Tests
        run: |
          if [ -f "analytics/package.json" ]; then cd analytics && npm test --if-present; else echo "Skipping tests"; fi

  build:
    name: Build Backend Docker Image
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: |
          if [ -f "analytics/Dockerfile" ]; then docker build -t backend:latest ./analytics; else echo "No Dockerfile found"; fi