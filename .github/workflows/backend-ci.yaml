name: Backend Continuous Integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: |
          if [ -d "analytics" ]; then
            npm ci --prefix analytics || npm install --prefix analytics
          else
            npm ci --prefix backend || npm install --prefix backend
          fi
      - name: Run Lint
        run: |
          if [ -d "analytics" ]; then
            npm run lint --prefix analytics || true
          else
            npm run lint --prefix backend || true
          fi

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: |
          if [ -d "analytics" ]; then
            npm ci --prefix analytics || npm install --prefix analytics
          else
            npm ci --prefix backend || npm install --prefix backend
          fi
      - name: Run Tests
        run: |
          if [ -d "analytics" ]; then
            npm run test --prefix analytics || true
          else
            npm run test --prefix backend || true
          fi

  build:
    name: Build Backend Docker Image
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: |
          if [ -d "analytics" ]; then
            docker build -t backend:latest ./analytics
          else
            docker build -t backend:latest ./backend
          fi