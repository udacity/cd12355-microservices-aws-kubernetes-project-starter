name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm run lint

  test:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm test

  build-and-deploy:
    name: Build, Push ECR & Deploy Backend
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t backend:latest ./backend

      - name: Configure AWS Credentials
        run: echo "Configuring AWS credentials..."

      - name: Log in to Amazon ECR
        run: echo "Logging into Amazon ECR..."

      - name: Push Docker Image to ECR
        run: echo "Pushing backend image to ECR..."

      - name: Deploy to Kubernetes Cluster
        run: echo "Deploying backend to EKS cluster..."