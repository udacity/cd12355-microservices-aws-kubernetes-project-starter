name: Frontend Continuous Integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: |
          if [ -d "frontend" ]; then
            npm ci --prefix frontend || npm install --prefix frontend
          else
            npm ci || npm install
          fi
      - name: Run Lint
        run: |
          if [ -d "frontend" ]; then
            npm run lint --prefix frontend || true
          else
            npm run lint || true
          fi

  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: |
          if [ -d "frontend" ]; then
            npm ci --prefix frontend || npm install --prefix frontend
          else
            npm ci || npm install
          fi
      - name: Run Tests
        run: |
          if [ -d "frontend" ]; then
            npm run test --prefix frontend -- --watchAll=false || true
          else
            npm run test -- --watchAll=false || true
          fi

  build:
    name: Build Frontend Docker Image
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: |
          if [ -d "frontend" ]; then
            docker build -t frontend:latest ./frontend
          else
            docker build -t frontend:latest .
          fi