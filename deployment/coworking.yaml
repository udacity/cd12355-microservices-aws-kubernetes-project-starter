apiVersion: v1
kind: Service
metadata:
  name: coworking
spec:
  type: LoadBalancer
  selector:
    service: coworking
  ports:
  - name: "5153"
    protocol: TCP
    port: 5153
    targetPort: 5153
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coworking
  labels:
    name: coworking
spec:
  replicas: 1
  selector:
    matchLabels:
      service: coworking
  template:
    metadata:
      labels:
        service: coworking
      annotations: 
        sidecar.opentelemetry.io/inject: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-sdk: "false"
    spec:
      containers:
      - name: coworking
        image: 423656921501.dkr.ecr.us-east-1.amazonaws.com/test-coworking-analytics:3
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /health_check
            port: 5153
          initialDelaySeconds: 5
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: "/readiness_check"
            port: 5153
          initialDelaySeconds: 5
          timeoutSeconds: 5
        envFrom:
        - configMapRef:
            name: app-env-config
        env:
        - name: OTEL_TRACES_EXPORTER
          value: "none"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-env-secret 
              key: DB_PASSWORD
      restartPolicy: Always